name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  swift-test:
    name: swift test (CoachingEngine + adapters)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Resolve packages
        working-directory: GymBuddy
        run: swift package resolve
      - name: Build
        working-directory: GymBuddy
        run: swift build -c release
      - name: Test
        working-directory: GymBuddy
        run: swift test --enable-code-coverage --parallel
      - name: Coverage report
        working-directory: GymBuddy
        run: |
          xcrun llvm-cov report \
            .build/debug/GymBuddyPackageTests.xctest/Contents/MacOS/GymBuddyPackageTests \
            -instr-profile=.build/debug/codecov/default.profdata \
            -ignore-filename-regex="Tests/|\\.build/" || true

  ios-build:
    name: Build iOS app
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build for iOS simulator
        working-directory: GymBuddy
        run: |
          xcodebuild build-for-testing \
            -scheme GymBuddyApp \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -configuration Debug | xcpretty || true

  ui-tests:
    name: XCUITest (onboarding + live session happy path)
    runs-on: macos-14
    needs: ios-build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Run UI tests
        working-directory: GymBuddy
        run: |
          xcodebuild test-without-building \
            -scheme GymBuddyApp \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -only-testing:GymBuddyAppUITests | xcpretty || true

  lint:
    name: SwiftLint + dependency-direction lint
    runs-on: macos-14
    env:
      # Pin SwiftLint to an exact release so the ruleset cannot drift. Single source
      # of truth for the lint job — bump this in lockstep with the team's local
      # version (`brew upgrade swiftlint` then update here). 0.63.2 is current.
      SWIFTLINT_VERSION: 0.63.2
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint (pinned)
        # Unpinned `brew install swiftlint` previously broke CI: 0.63.x added/flipped
        # rules (static_over_final_class, the trailing_comma default) that older
        # versions never fired, and `--strict` turns every new warning into a hard
        # error. The portable zip ships a universal (x86_64+arm64) binary, so it runs
        # on the arm64 macos-14 runner.
        run: |
          set -euo pipefail
          curl -fsSL -o portable_swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q portable_swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Verify SwiftLint version
        run: |
          set -euo pipefail
          INSTALLED="$(swiftlint version)"
          echo "SwiftLint ${INSTALLED} (expected ${SWIFTLINT_VERSION})"
          test "${INSTALLED}" = "${SWIFTLINT_VERSION}"
      - name: SwiftLint
        run: swiftlint --strict --reporter github-actions-logging
      - name: Dependency direction (no forbidden imports in CoachingEngine)
        run: |
          set -e
          VIOLATIONS=$(grep -rE '^import (UIKit|SwiftUI|Vision|CoreML|AVFoundation|HealthKit|Speech|SwiftData)' GymBuddy/Sources/CoachingEngine || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ CoachingEngine cannot import platform/vendor frameworks:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ CoachingEngine is pure Swift."

  north-star-guard:
    name: North-star demo test (hero moment)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Resolve + run just the hero test
        working-directory: GymBuddy
        run: swift test --filter NorthStarDemoTest
